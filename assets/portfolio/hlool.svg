<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'Segoe UI',Tahoma,sans-serif" direction="rtl">
  <defs>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="hlglass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="#eef0fb"/>
  <!-- browser window -->
  <rect x="70" y="70" width="1060" height="660" rx="22" fill="#ffffff" stroke="#dcdcf2" stroke-width="2"/>
  <rect x="70" y="70" width="1060" height="70" rx="22" fill="#f4f4fc"/>
  <rect x="70" y="118" width="1060" height="22" fill="#f4f4fc"/>
  <circle cx="112" cy="105" r="9" fill="#ff5f57"/>
  <circle cx="146" cy="105" r="9" fill="#febc2e"/>
  <circle cx="180" cy="105" r="9" fill="#28c840"/>
  <rect x="360" y="90" width="640" height="30" rx="15" fill="#ffffff" stroke="#dcdcf2"/>
  <text x="680" y="111" fill="#4f46e5" font-size="17" text-anchor="middle" direction="ltr">🔒 hlool.ps</text>
  <!-- hero banner -->
  <rect x="90" y="160" width="1020" height="250" rx="14" fill="url(#hl)"/>
  <rect x="90" y="160" width="1020" height="125" rx="14" fill="url(#hlglass)"/>
  <text x="1050" y="245" fill="#ffffff" font-size="42" font-weight="800" text-anchor="end">متجر حلول الإلكتروني</text>
  <text x="1050" y="298" fill="#ffffff" fill-opacity=".9" font-size="23" text-anchor="end">منتجات تقنية · أدوات · أنظمة حماية · إكسسوارات</text>
  <rect x="820" y="335" width="230" height="56" rx="28" fill="#ffffff"/>
  <text x="935" y="372" fill="#4f46e5" font-size="22" font-weight="800" text-anchor="middle">تسوّق الآن</text>
  <!-- tools illustration -->
  <g transform="translate(150,205)">
    <rect x="0" y="0" width="150" height="150" rx="24" fill="#ffffff" fill-opacity=".16"/>
    <circle cx="75" cy="70" r="34" fill="none" stroke="#ffffff" stroke-width="10"/>
    <rect x="95" y="92" width="46" height="14" rx="7" transform="rotate(45 95 92)" fill="#ffffff"/>
  </g>
  <!-- category chips -->
  <g>
    <rect x="640" y="450" width="200" height="54" rx="27" fill="#eef0fb" stroke="#dcdcf2"/>
    <rect x="860" y="450" width="190" height="54" rx="27" fill="#eef0fb" stroke="#dcdcf2"/>
    <text x="940" y="485" fill="#4f46e5" font-size="19" font-weight="700" text-anchor="middle">إكسسوارات</text>
    <text x="740" y="485" fill="#4f46e5" font-size="19" font-weight="700" text-anchor="middle">أنظمة حماية</text>
  </g>
  <!-- product cards -->
  <g>
    <rect x="150" y="530" width="290" height="150" rx="14" fill="#ffffff" stroke="#e6e6f4"/>
    <rect x="470" y="530" width="290" height="150" rx="14" fill="#ffffff" stroke="#e6e6f4"/>
    <rect x="790" y="530" width="260" height="150" rx="14" fill="#ffffff" stroke="#e6e6f4"/>
    <rect x="180" y="552" width="105" height="105" rx="10" fill="#eef0fb"/>
    <rect x="500" y="552" width="105" height="105" rx="10" fill="#eef0fb"/>
    <rect x="815" y="552" width="100" height="105" rx="10" fill="#eef0fb"/>
    <rect x="305" y="565" width="115" height="12" rx="6" fill="#e2e2f0"/>
    <rect x="625" y="565" width="115" height="12" rx="6" fill="#e2e2f0"/>
    <rect x="935" y="565" width="95" height="12" rx="6" fill="#e2e2f0"/>
    <text x="420" y="640" fill="#0f766e" font-size="21" font-weight="800" text-anchor="end">₪320</text>
    <text x="740" y="640" fill="#0f766e" font-size="21" font-weight="800" text-anchor="end">₪180</text>
    <text x="1030" y="640" fill="#0f766e" font-size="21" font-weight="800" text-anchor="end">₪95</text>
  </g>
</svg>
