<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'Segoe UI',Tahoma,sans-serif" direction="rtl">
  <defs>
    <linearGradient id="sc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#be185d"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="scgold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7dca0"/>
      <stop offset="1" stop-color="#d9a441"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="#faeef5"/>
  <!-- browser window -->
  <rect x="70" y="70" width="1060" height="660" rx="22" fill="#ffffff" stroke="#eed5e3" stroke-width="2"/>
  <rect x="70" y="70" width="1060" height="70" rx="22" fill="#fdf4f9"/>
  <rect x="70" y="118" width="1060" height="22" fill="#fdf4f9"/>
  <circle cx="112" cy="105" r="9" fill="#ff5f57"/>
  <circle cx="146" cy="105" r="9" fill="#febc2e"/>
  <circle cx="180" cy="105" r="9" fill="#28c840"/>
  <rect x="360" y="90" width="640" height="30" rx="15" fill="#ffffff" stroke="#eed5e3"/>
  <text x="680" y="111" fill="#be185d" font-size="16" text-anchor="middle" direction="ltr">🔒 scuba-cosmatics.com</text>
  <!-- hero -->
  <rect x="90" y="160" width="1020" height="290" rx="14" fill="url(#sc)"/>
  <text x="1050" y="248" fill="url(#scgold)" font-size="44" font-weight="800" text-anchor="end">سكوبا كوزمتكس</text>
  <text x="1050" y="300" fill="#f6e2ef" font-size="22" text-anchor="end">عطور فاخرة · مستحضرات تجميل · منذ 2005</text>
  <rect x="810" y="335" width="240" height="56" rx="28" fill="url(#scgold)"/>
  <text x="930" y="372" fill="#7c3aed" font-size="22" font-weight="800" text-anchor="middle">تسوّقي الآن</text>
  <!-- cosmetics illustration: lipstick + perfume -->
  <g transform="translate(160,200)">
    <rect x="30" y="60" width="34" height="90" rx="6" fill="#ffffff"/>
    <rect x="30" y="30" width="34" height="34" rx="4" fill="url(#scgold)"/>
    <rect x="90" y="80" width="46" height="70" rx="12" fill="#ffffff" fill-opacity=".92"/>
    <rect x="100" y="58" width="26" height="26" rx="4" fill="url(#scgold)"/>
  </g>
  <!-- product cards -->
  <g>
    <rect x="150" y="490" width="290" height="190" rx="14" fill="#ffffff" stroke="#f2dde9"/>
    <rect x="470" y="490" width="290" height="190" rx="14" fill="#ffffff" stroke="#f2dde9"/>
    <rect x="790" y="490" width="260" height="190" rx="14" fill="#ffffff" stroke="#f2dde9"/>
    <rect x="185" y="512" width="95" height="95" rx="10" fill="#faeef5"/>
    <rect x="505" y="512" width="95" height="95" rx="10" fill="#faeef5"/>
    <rect x="820" y="512" width="95" height="95" rx="10" fill="#faeef5"/>
    <rect x="305" y="525" width="120" height="13" rx="6" fill="#e6c6d9"/>
    <rect x="625" y="525" width="120" height="13" rx="6" fill="#e6c6d9"/>
    <rect x="940" y="525" width="90" height="13" rx="6" fill="#e6c6d9"/>
    <text x="420" y="655" fill="#be185d" font-size="21" font-weight="800" text-anchor="end">﷼ 260</text>
    <text x="740" y="655" fill="#be185d" font-size="21" font-weight="800" text-anchor="end">﷼ 120</text>
    <text x="1030" y="655" fill="#be185d" font-size="21" font-weight="800" text-anchor="end">﷼ 75</text>
  </g>
</svg>
