<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'Segoe UI',Tahoma,sans-serif" direction="rtl">
  <defs>
    <linearGradient id="hk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5a3"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="hkglass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="#eef6f6"/>
  <!-- browser window -->
  <rect x="70" y="70" width="1060" height="660" rx="22" fill="#ffffff" stroke="#d5e3e3" stroke-width="2"/>
  <rect x="70" y="70" width="1060" height="70" rx="22" fill="#f1f7f7"/>
  <rect x="70" y="118" width="1060" height="22" fill="#f1f7f7"/>
  <circle cx="112" cy="105" r="9" fill="#ff5f57"/>
  <circle cx="146" cy="105" r="9" fill="#febc2e"/>
  <circle cx="180" cy="105" r="9" fill="#28c840"/>
  <rect x="360" y="90" width="640" height="30" rx="15" fill="#ffffff" stroke="#d5e3e3"/>
  <text x="680" y="111" fill="#0e7490" font-size="17" text-anchor="middle" direction="ltr">🔒 alhakim.ps</text>
  <!-- hero -->
  <rect x="90" y="160" width="1020" height="330" rx="14" fill="url(#hk)"/>
  <rect x="90" y="160" width="1020" height="165" rx="14" fill="url(#hkglass)"/>
  <!-- medical cross badge -->
  <g transform="translate(940,210)">
    <circle cx="60" cy="60" r="60" fill="#ffffff" fill-opacity=".16"/>
    <rect x="46" y="24" width="28" height="72" rx="8" fill="#ffffff"/>
    <rect x="24" y="46" width="72" height="28" rx="8" fill="#ffffff"/>
  </g>
  <text x="1050" y="250" fill="#ffffff" font-size="40" font-weight="800" text-anchor="end">مجمع الحكيم الطبي</text>
  <text x="1050" y="305" fill="#ffffff" fill-opacity=".9" font-size="24" text-anchor="end">مجمع طبي متكامل لعلاج كل أفراد العائلة</text>
  <rect x="820" y="345" width="230" height="60" rx="30" fill="#ffffff"/>
  <text x="935" y="384" fill="#0e7490" font-size="23" font-weight="700" text-anchor="middle">احجز موعدك</text>
  <!-- clinic cards -->
  <g>
    <rect x="150" y="530" width="290" height="150" rx="14" fill="#ffffff" stroke="#d5e3e3"/>
    <rect x="470" y="530" width="290" height="150" rx="14" fill="#ffffff" stroke="#d5e3e3"/>
    <rect x="790" y="530" width="260" height="150" rx="14" fill="#ffffff" stroke="#d5e3e3"/>
    <circle cx="985" cy="575" r="20" fill="#0ea5a3" fill-opacity=".15"/>
    <circle cx="665" cy="575" r="20" fill="#0ea5a3" fill-opacity=".15"/>
    <circle cx="345" cy="575" r="20" fill="#0ea5a3" fill-opacity=".15"/>
    <text x="1030" y="630" fill="#0e7490" font-size="20" font-weight="700" text-anchor="end">الأسنان</text>
    <text x="710" y="630" fill="#0e7490" font-size="20" font-weight="700" text-anchor="end">الطوارئ</text>
    <text x="390" y="630" fill="#0e7490" font-size="20" font-weight="700" text-anchor="end">القلب</text>
    <rect x="810" y="648" width="150" height="12" rx="6" fill="#e2eef0"/>
    <rect x="490" y="648" width="150" height="12" rx="6" fill="#e2eef0"/>
    <rect x="170" y="648" width="150" height="12" rx="6" fill="#e2eef0"/>
  </g>
</svg>
