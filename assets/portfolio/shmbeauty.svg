  </defs>
  <rect width="1200" height="800" fill="#f6eef1"/>
  <!-- browser window -->
  <rect x="70" y="70" width="1060" height="660" rx="22" fill="#ffffff" stroke="#e7d6dd" stroke-width="2"/>
  <rect x="70" y="70" width="1060" height="70" rx="22" fill="#faf2f5"/>
  <rect x="70" y="118" width="1060" height="22" fill="#faf2f5"/>
  <circle cx="112" cy="105" r="9" fill="#ff5f57"/>
  <circle cx="146" cy="105" r="9" fill="#febc2e"/>
  <circle cx="180" cy="105" r="9" fill="#28c840"/>
