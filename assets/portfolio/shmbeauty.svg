    <rect x="790" y="500" width="260" height="180" rx="14" fill="#ffffff" stroke="#eeddE4"/>
    <rect x="185" y="522" width="90" height="90" rx="10" fill="#f6eef1"/>
    <rect x="505" y="522" width="90" height="90" rx="10" fill="#f6eef1"/>
    <rect x="820" y="522" width="90" height="90" rx="10" fill="#f6eef1"/>
    <rect x="300" y="535" width="120" height="13" rx="6" fill="#c9aeb9"/>
    <rect x="620" y="535" width="120" height="13" rx="6" fill="#c9aeb9"/>
    <rect x="935" y="535" width="95" height="13" rx="6" fill="#c9aeb9"/>
    <text x="420" y="655" fill="#7a1e46" font-size="21" font-weight="800" text-anchor="end">﷼ 320</text>
    <text x="740" y="655" fill="#7a1e46" font-size="21" font-weight="800" text-anchor="end">﷼ 450</text>
