  <rect x="90" y="160" width="1020" height="300" rx="14" fill="url(#sb)"/>
  <text x="1050" y="255" fill="url(#gold)" font-size="46" font-weight="800" text-anchor="end">سهم بيوتي</text>
  <text x="1050" y="308" fill="#f3d9e3" font-size="23" text-anchor="end">عطور فاخرة أصلية · نيش · رجالي · نسائي</text>
