    <rect x="40" y="42" width="50" height="14" rx="4" fill="#e9c877"/>
    <rect x="34" y="56" width="62" height="130" rx="16" fill="#ffffff" fill-opacity=".9"/>
    <rect x="46" y="96" width="38" height="70" rx="8" fill="#7a1e46" fill-opacity=".35"/>
    <rect x="46" y="150" width="38" height="16" rx="4" fill="url(#gold)"/>
  </g>
